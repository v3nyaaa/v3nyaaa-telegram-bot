services:
  - type: worker
    name: v3nyaaa-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: v3nyaaa-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: BOT_DATA_DIR
        value: /var/data
